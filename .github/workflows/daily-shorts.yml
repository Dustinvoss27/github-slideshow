name: Daily word-of-the-day Short

on:
  schedule:
    # 15:37 UTC = 11:37 AM New York / 8:37 AM Los Angeles. Change to suit your audience.
    # Add more lines to post more than once a day.
    - cron: "37 15 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write   # to commit data/state.json (which words were used)

concurrency:
  group: daily-shorts
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: shorts
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: shorts/requirements.txt

      - name: Install ffmpeg and fonts
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Render (and upload) today's Short
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.upload }}" = "true" ]; then
            python -m shortsbot wotd --upload
          else
            python -m shortsbot wotd
          fi

      - name: Keep the video as a downloadable artifact (for TikTok / Reels / cross-posting)
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_number }}
          path: |
            shorts/out/*.mp4
            shorts/out/*.json
          retention-days: 14

      - name: Commit updated state
        run: |
          git config user.name "shortsbot"
          git config user.email "shortsbot@users.noreply.github.com"
          git add data/state.json
          git diff --cached --quiet || git commit -m "shortsbot: post $(date -u +%F) [skip ci]"
          git push
